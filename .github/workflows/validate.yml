name: Validate ManilaMC Store
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - run: node --check admin.js
      - run: node --check server/src/index.js
      - run: node --check server/src/catalog.js
