<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ManilaMC Store Admin</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1100px;margin:48px auto;padding:24px}.admin-card{background:#111a2b;border:1px solid #26344b;border-radius:14px;padding:22px;margin:18px 0}.admin-form{display:flex;gap:10px;flex-wrap:wrap}.admin-form input{flex:1;min-width:220px;background:#080d18;color:#fff;border:1px solid #34445d;border-radius:8px;padding:12px}.admin-button{background:#168cff;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:700}.admin-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}.admin-table th,.admin-table td{text-align:left;padding:12px;border-bottom:1px solid #26344b;vertical-align:top}.admin-table th{color:#8ebcff}.admin-muted{color:#9eacc2}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-status{padding:4px 8px;border-radius:20px;background:#24354c;display:inline-block}.admin-error{color:#ff8d8d}.admin-ok{color:#86e6ae}@media(max-width:700px){.admin-table{display:block;overflow-x:auto;white-space:nowrap}}
</style></head><body><main class="admin-wrap"><div class="eyebrow">MANILAMC / PRIVATE AREA</div><h1>STORE <span>ADMIN.</span></h1><p class="admin-muted">Review manual payments and monitor reward delivery. Keep this page private.</p>
<section class="admin-card"><h2>Admin authentication</h2><div class="admin-form"><input id="api-url" placeholder="Backend URL, e.g. https://api.example.com"><input id="admin-token" type="password" autocomplete="off" placeholder="Admin token"><button class="admin-button" id="connect">Connect</button></div><p id="message" class="admin-muted">The token is kept only in this browser tab's session.</p></section>
<section class="admin-card"><div class="admin-form" style="justify-content:space-between"><h2>Orders</h2><button class="admin-button" id="refresh">Refresh orders</button></div><div id="orders" class="admin-muted">Connect to your backend to load orders.</div></section></main>
<script src="admin.js"></script></body></html>
