<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status · ManilaMC</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:720px;margin:12vh auto;padding:24px;text-align:center"><div class="eyebrow">MANILAMC STORE</div><h1>PAYMENT <span>RETURNED.</span></h1><p id="status" class="modal-note">Checking the order status with ManilaMC…</p><a class="primary-button" href="index.html">Back to store</a></main><script src="config.js"></script><script>
(async()=>{const el=document.getElementById("status");const id=new URLSearchParams(location.search).get("order_id");const api=(window.STORE_CONFIG?.apiBaseUrl||"").replace(/\/$/,"");if(!id||!api){el.textContent="The payment provider returned you to the store. Keep your order ID and contact staff if the order does not update.";return;}try{const r=await fetch(api+"/api/orders/"+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error);el.textContent="Order "+d.id+" · Payment: "+d.payment_status+" · Reward delivery: "+d.delivery_status+". The signed payment notification is the source of truth; if it is still pending, wait briefly and refresh.";}catch(e){el.textContent="We could not retrieve the order status. Keep your order ID: "+id+". Contact staff if it remains pending.";}})();
</script></body></html>
